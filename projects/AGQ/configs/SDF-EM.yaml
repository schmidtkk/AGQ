# Configuration for SDF prediction model training on EM dataset
# Uses MONAI UNet3D to predict 3D Signed Distance Function

SYSTEM:
  NUM_GPUS: 1
  NUM_CPUS: 4

AUGMENTOR:
  SMOOTH: False

MODEL:
  ARCHITECTURE: SDFUNet3D
  # Input size must be divisible by 2^(num_strides)=16 for proper UNet skip connections
  INPUT_SIZE: [16, 256, 256]
  OUTPUT_SIZE: [16, 256, 256]
  IN_PLANES: 1
  OUT_PLANES: 1
  # SDF-specific target option: S-truncation_distance
  TARGET_OPT: ["S-10"]
  LOSS_OPTION: [["L1Loss"]]
  LOSS_WEIGHT: [[1.0]]
  WEIGHT_OPT: [["0"]]
  OUTPUT_ACT: [["tanh"]]
  FILTERS: [32, 64, 128, 256]
  NORM_MODE: instance

DATASET:
  INPUT_PATH: datasets/EM/
  IMAGE_NAME: EM_train_inputs.h5
  LABEL_NAME: EM_train_labels.h5
  VAL_IMAGE_NAME: EM_val_inputs.h5
  VAL_LABEL_NAME: EM_val_labels.h5
  OUTPUT_PATH: outputs/EM/SDF
  PAD_SIZE: [4, 64, 64]
  REDUCE_LABEL: False  # Keep original labels for SDF computation
  REJECT_SAMPLING:
    SIZE_THRES: 100
    DIVERSITY: 2
    P: 0.95

SOLVER:
  NAME: Adam
  LR_SCHEDULER_NAME: WarmupCosineLR
  BASE_LR: 0.0001
  ITERATION_STEP: 1
  ITERATION_SAVE: 10000
  ITERATION_TOTAL: 100000
  ITERATION_VAL: 5000
  SAMPLES_PER_BATCH: 2

MONITOR:
  ITERATION_NUM: [200, 1000]
  LOG_OPT: [1, 1, 1]

INFERENCE:
  INPUT_SIZE: [16, 256, 256]
  OUTPUT_SIZE: [16, 256, 256]
  OUTPUT_ACT: ["tanh"]
  IMAGE_NAME: EM_val_inputs.h5
  OUTPUT_PATH: outputs/EM/SDF/test
  OUTPUT_NAME: sdf_result.h5
  PAD_SIZE: [4, 32, 32]
  STRIDE: [8, 128, 128]
  SAMPLES_PER_BATCH: 4
